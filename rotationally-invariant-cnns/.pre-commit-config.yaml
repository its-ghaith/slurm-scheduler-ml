exclude: "^notebooks/"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: "v0.9.3"
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo:
      https://github.com/astral-sh/uv-pre-commit
      # uv version.
    rev: 0.10.2
    hooks:
      - id: uv-lock
