[project]
name = "countcv"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Your Name", email = "you@example.com" }]

# Base dependencies (without torch/torchvision - those are in optional-dependencies)
dependencies = [
  "albumentations>=2.0.8",
  "codecarbon>=3.0.2",
  "groundingdino-py>=0.4.0",
  "hydra-core>=1.3.2",
  "jwt>=1.3.1",
  "matplotlib>=3.10.1",
  "mlflow>=2.22.0",
  "numpy>=1.22,<2.0",
  "opencv-python==4.11.0.86",
  "optuna>=4.6",
  "pandas>=2.2.3",
  "plyer>=2.1.0",
  "scikit-image>=0.25.2",
  "seaborn>=0.13.2",
  "streamlit>=1.55.0",
  "tensorboard>=2.19.0",
  "torchmetrics[detection]>=1.7.4",
  "tqdm>=4.67.1",
  "transformers>=4.54.0",
  "ultralytics>=8.3.162"
]

# Use dependency-groups for torch variants (supports default-groups)
[dependency-groups]
# Pin with local version identifier (+cpu/+cu126) to work around PyTorch index metadata bug
# See: https://github.com/astral-sh/uv/issues/17314
cpu = [
  "torch==2.7.1+cpu",
  "torchvision==0.22.1+cpu",
]
gpu = [
  "torch==2.7.1+cu126",
  "torchvision==0.22.1+cu126",
]

dev = [
  "ipykernel>=6.30.0",
  "ipywidgets>=8.1.7",
  "pytest>=8.4.1",
  "ruff>=0.12.5",
  "ty>=0.0.9",
]
escnn = [
  "escnn>=1.0.11",
]

[build-system]
requires = ["uv_build>=0.9.23,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # Pyflakes
  "UP",  # pyupgrade
  "B",  # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",  # isort
]
fixable = ["ALL"]

[tool.ruff.format]
indent-style = "tab"

[tool.ty]
[tool.ty.environment]
python = ".venv"

[tool.ty.rules]
invalid-argument-type = "warn"

# Declare cpu and gpu as conflicting (can't install both)
[tool.uv]
# GPU is the default when no group is specified
default-groups = ["gpu", "dev"]
conflicts = [
  [
    { group = "cpu" },
    { group = "gpu" },
  ],
]

# UV-specific configuration for conditional sources
# Now using dependency-groups instead of extras
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-gpu", group = "gpu" },
]
torchvision = [
  { index = "pytorch-cpu", group = "cpu" },
  { index = "pytorch-gpu", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
