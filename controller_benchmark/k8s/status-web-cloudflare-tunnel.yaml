apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-benchmark-status-tunnel
  namespace: mlops-energy
  labels:
    app: controller-benchmark-status-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller-benchmark-status-tunnel
  template:
    metadata:
      labels:
        app: controller-benchmark-status-tunnel
    spec:
      nodeSelector:
        kubernetes.io/hostname: acds-cpu-01
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - --url
            - http://controller-benchmark-status-web:8088
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
