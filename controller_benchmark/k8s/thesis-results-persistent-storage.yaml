apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slurmd-workspace-cache-pvc
  namespace: mlops-energy
  labels:
    app.kubernetes.io/part-of: thesis-results-energy-adaptive-mlops
    data-retention: long-term
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: longhorn
---
