<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290" viewBox="0 0 1800 1290" role="img" aria-labelledby="title description">
  <title id="title">Technische Bereitstellung der MLOps- und Messumgebung</title>
  <desc id="description">Deploymentansicht des Namespace mlops-energy. benchmark-orchestrator, slurmctld und slurmd sind auf malea-srv01 festgelegt. MLflow, Pushgateway, Prometheus und Grafana werden ohne festen nodeSelector eingeplant; Prometheus schließt acds-cpu-01 aus. Der Trainingsprozess mit Controller liegt im slurmd-Container, der Node Exporter in einem weiteren Container desselben Pods. Persistente Volumes werden über S1 bis S4 zugeordnet.</desc>
