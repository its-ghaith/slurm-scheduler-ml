apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slurmd-workspace-cache-pvc
  namespace: mlops-energy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: slurmd
  namespace: mlops-energy
spec:
  selector:
    app: slurmd
  ports:
    - name: slurmd
      port: 6818
      targetPort: 6818
---
apiVersion: v1
kind: Service
metadata:
  name: slurm-inference
  namespace: mlops-energy
spec:
  selector:
    app: slurmd
  ports:
    - name: http
      port: 7860
      targetPort: 7860
---
apiVersion: v1
kind: Service
metadata:
  name: slurmd-node-exporter
  namespace: mlops-energy
spec:
  selector:
    app: slurmd
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops-energy
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: slurmd-node-exporter
        static_configs:
          - targets: ['slurmd-node-exporter:9100']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mlops-energy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
