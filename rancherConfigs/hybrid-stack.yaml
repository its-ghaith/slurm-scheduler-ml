apiVersion: v1
kind: ConfigMap
metadata:
  name: slurm-connector-config
  namespace: mlops-energy
data:
  REMOTE_PROJECT_DIR: /home/slurm/mlops-project
  REMOTE_SLURM_SCRIPT: slurm/train_distributed_mlflow_job.slurm
  REMOTE_MLFLOW_TRACKING_URI: http://mlflow.mlops-energy.svc.cluster.local:5000
  ENABLE_REVERSE_TUNNEL: "0"
  REVERSE_TUNNEL_BIND: 5000:mlflow.mlops-energy.svc.cluster.local:5000
  SSH_STRICT_HOST_KEY_CHECKING: "yes"
  PROM_PUSHGATEWAY_URL: http://pushgateway:9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slurm-connector
  namespace: mlops-energy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slurm-connector
  template:
    metadata:
      labels:
        app: slurm-connector
    spec:
      containers:
        - name: connector
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc"]
          args:
            - |
              apk add --no-cache bash openssh-client sshpass && \
              tail -f /dev/null
          env:
            - name: SLURM_SSH_HOST
              valueFrom:
                secretKeyRef:
                  name: slurm-connector-target
                  key: host
            - name: SLURM_SSH_PORT
              valueFrom:
                secretKeyRef:
                  name: slurm-connector-target
                  key: port
            - name: SLURM_SSH_USER
              valueFrom:
                secretKeyRef:
                  name: slurm-connector-target
                  key: user
            - name: SLURM_SSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slurm-connector-target
                  key: password
                  optional: true
            - name: REMOTE_PROJECT_DIR
              valueFrom:
                configMapKeyRef:
                  name: slurm-connector-config
                  key: REMOTE_PROJECT_DIR
            - name: REMOTE_SLURM_SCRIPT
              valueFrom:
                configMapKeyRef:
                  name: slurm-connector-config
                  key: REMOTE_SLURM_SCRIPT
            - name: REMOTE_MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: slurm-connector-config
                  key: REMOTE_MLFLOW_TRACKING_URI
            - name: ENABLE_REVERSE_TUNNEL
              valueFrom:
                configMapKeyRef:
                  name: slurm-connector-config
                  key: ENABLE_REVERSE_TUNNEL
            - name: REVERSE_TUNNEL_BIND
              valueFrom:
                configMapKeyRef:
                  name: slurm-connector-config
                  key: REVERSE_TUNNEL_BIND
            - name: SSH_STRICT_HOST_KEY_CHECKING
              valueFrom:
                configMapKeyRef:
                  name: slurm-connector-config
                  key: SSH_STRICT_HOST_KEY_CHECKING
            - name: PROM_PUSHGATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: slurm-connector-config
                  key: PROM_PUSHGATEWAY_URL
          volumeMounts:
            - name: connector-ssh
              mountPath: /etc/slurm-connector/ssh
              readOnly: true
            - name: connector-script
              mountPath: /opt/slurm-connector
              readOnly: true
      volumes:
        - name: connector-ssh
          secret:
            secretName: slurm-connector-ssh
            defaultMode: 0400
        - name: connector-script
          configMap:
            name: slurm-connector-script
            defaultMode: 0555
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slurm-connector-script
  namespace: mlops-energy
data:
  submit_remote_slurm.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    required_vars=(
      SLURM_SSH_HOST
      SLURM_SSH_PORT
      SLURM_SSH_USER
      REMOTE_PROJECT_DIR
      REMOTE_SLURM_SCRIPT
      REMOTE_MLFLOW_TRACKING_URI
    )
    for v in "${required_vars[@]}"; do
      if [ -z "${!v:-}" ]; then
        echo "Missing required variable: ${v}" >&2
        exit 2
      fi
    done

    BATCH_SIZE="${BATCH_SIZE:-64}"
    GPU_SAMPLE_INTERVAL_SEC="${GPU_SAMPLE_INTERVAL_SEC:-1}"
    ELECTRICITY_PRICE_EUR_PER_KWH="${ELECTRICITY_PRICE_EUR_PER_KWH:-0.30}"
    GRID_CO2_KG_PER_KWH="${GRID_CO2_KG_PER_KWH:-0.40}"
    PUE_FACTOR="${PUE_FACTOR:-1.0}"
    MLFLOW_LOG_JOB_ENERGY="${MLFLOW_LOG_JOB_ENERGY:-1}"
    MLFLOW_JOB_ENERGY_EXPERIMENT="${MLFLOW_JOB_ENERGY_EXPERIMENT:-ml-energy-poc}"
    PROM_PUSHGATEWAY_URL="$(echo "${PROM_PUSHGATEWAY_URL:-http://pushgateway:9091}" | tr -d '\r')"

    strict_mode="${SSH_STRICT_HOST_KEY_CHECKING:-yes}"
    if [ -n "${SLURM_SSH_PASSWORD:-}" ]; then
      strict_mode="no"
    fi
    known_hosts_file="/etc/slurm-connector/ssh/known_hosts"
    if [ "${strict_mode}" = "no" ]; then
      known_hosts_file="/dev/null"
    fi

    SSH_BASE=(
      ssh
      -o UserKnownHostsFile="${known_hosts_file}"
      -o StrictHostKeyChecking="${strict_mode}"
      -p "${SLURM_SSH_PORT}"
      "${SLURM_SSH_USER}@${SLURM_SSH_HOST}"
    )
    if [ -n "${SLURM_SSH_PASSWORD:-}" ]; then
      SSH_BASE=(sshpass -p "${SLURM_SSH_PASSWORD}" ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o UserKnownHostsFile="${known_hosts_file}" -o StrictHostKeyChecking="${strict_mode}" -p "${SLURM_SSH_PORT}" "${SLURM_SSH_USER}@${SLURM_SSH_HOST}")
    else
      SSH_BASE=(ssh -i /etc/slurm-connector/ssh/id_ed25519 -o UserKnownHostsFile="${known_hosts_file}" -o StrictHostKeyChecking="${strict_mode}" -p "${SLURM_SSH_PORT}" "${SLURM_SSH_USER}@${SLURM_SSH_HOST}")
    fi

    if [ "${ENABLE_REVERSE_TUNNEL:-0}" = "1" ]; then
      "${SSH_BASE[@]}" -N -f -R "${REVERSE_TUNNEL_BIND}" || true
    fi

    REMOTE_ENV="BATCH_SIZE='${BATCH_SIZE}' MLFLOW_TRACKING_URI='${REMOTE_MLFLOW_TRACKING_URI}' GPU_SAMPLE_INTERVAL_SEC='${GPU_SAMPLE_INTERVAL_SEC}' ELECTRICITY_PRICE_EUR_PER_KWH='${ELECTRICITY_PRICE_EUR_PER_KWH}' GRID_CO2_KG_PER_KWH='${GRID_CO2_KG_PER_KWH}' PUE_FACTOR='${PUE_FACTOR}' MLFLOW_LOG_JOB_ENERGY='${MLFLOW_LOG_JOB_ENERGY}' MLFLOW_JOB_ENERGY_EXPERIMENT='${MLFLOW_JOB_ENERGY_EXPERIMENT}'"

    REMOTE_CMD="set -euo pipefail; cd '${REMOTE_PROJECT_DIR}'; ${REMOTE_ENV} sbatch '${REMOTE_SLURM_SCRIPT}'"
    SUBMIT_OUT="$("${SSH_BASE[@]}" "${REMOTE_CMD}")"
    echo "${SUBMIT_OUT}"

    JOB_ID="$(echo "${SUBMIT_OUT}" | sed -n 's/.*Submitted batch job \([0-9]\+\).*/\1/p' | tail -n1)"
    if [ -z "${JOB_ID}" ]; then
      JOB_ID="$(date +%s)"
    fi

    energy_kwh="$(awk -v b="${BATCH_SIZE}" 'BEGIN{printf "%.4f", (b*0.015)+0.25}')"
    cost_eur="$(awk -v e="${energy_kwh}" -v p="${ELECTRICITY_PRICE_EUR_PER_KWH}" 'BEGIN{printf "%.4f", e*p}')"
    co2_kg="$(awk -v e="${energy_kwh}" -v c="${GRID_CO2_KG_PER_KWH}" -v pue="${PUE_FACTOR}" 'BEGIN{printf "%.4f", e*c*pue}')"

    total_file="/tmp/slurm_training_energy_kwh_total.txt"
    if [ ! -f "${total_file}" ]; then
      echo "0" > "${total_file}"
    fi
    prev_total="$(cat "${total_file}")"
    new_total="$(awk -v p="${prev_total}" -v e="${energy_kwh}" 'BEGIN{printf "%.6f", p+e}')"
    echo "${new_total}" > "${total_file}"

    total_cost_eur="$(awk -v n="${new_total}" -v p="${ELECTRICITY_PRICE_EUR_PER_KWH}" 'BEGIN{printf "%.6f", n*p}')"
    total_co2_kg="$(awk -v n="${new_total}" -v c="${GRID_CO2_KG_PER_KWH}" -v pue="${PUE_FACTOR}" 'BEGIN{printf "%.6f", n*c*pue}')"

    if ! command -v curl >/dev/null 2>&1; then
      apk add --no-cache curl >/dev/null 2>&1 || true
    fi
    printf '%s\n' \
      "slurm_jobs_total 1" \
      "slurm_job_training_energy_kwh{job_id=\"${JOB_ID}\"} ${energy_kwh}" \
      "slurm_job_estimated_electricity_cost_eur{job_id=\"${JOB_ID}\"} ${cost_eur}" \
      "slurm_job_estimated_co2_kg{job_id=\"${JOB_ID}\"} ${co2_kg}" \
      "slurm_training_energy_kwh_total ${new_total}" \
      "slurm_jobs_training_energy_kwh_total ${new_total}" \
      "slurm_jobs_estimated_electricity_cost_eur_total ${total_cost_eur}" \
      "slurm_jobs_estimated_co2_kg_total ${total_co2_kg}" | tr -d '\r' | curl -fsS --data-binary @- "$(echo "${PROM_PUSHGATEWAY_URL}/metrics/job/slurm_jobs" | tr -d '\r')" >/dev/null
  test_remote_slurm.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    strict_mode="${SSH_STRICT_HOST_KEY_CHECKING:-yes}"
    known_hosts_file="/etc/slurm-connector/ssh/known_hosts"
    if [ "${strict_mode}" = "no" ]; then
      known_hosts_file="/dev/null"
    fi
    if [ -n "${SLURM_SSH_PASSWORD:-}" ]; then
      sshpass -p "${SLURM_SSH_PASSWORD}" ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o UserKnownHostsFile="${known_hosts_file}" -o StrictHostKeyChecking="${strict_mode}" -p "${SLURM_SSH_PORT}" "${SLURM_SSH_USER}@${SLURM_SSH_HOST}" "sinfo -N -l"
    else
      ssh -i /etc/slurm-connector/ssh/id_ed25519 -o UserKnownHostsFile="${known_hosts_file}" -o StrictHostKeyChecking="${strict_mode}" -p "${SLURM_SSH_PORT}" "${SLURM_SSH_USER}@${SLURM_SSH_HOST}" "sinfo -N -l"
    fi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: mlops-energy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9091
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: mlops-energy
spec:
  selector:
    app: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-energy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: mlflow
          image: ghcr.io/its-ghaith/slurm-scheduler-ml/mlops-slurm-runtime:latest
          imagePullPolicy: Always
          env:
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "*"
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "*"
          command: ["/bin/bash", "-lc"]
          args:
            - |
              mkdir -p /mlflow /mlruns && \
              mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri sqlite:////mlflow/mlflow.db \
                --default-artifact-root /mlruns
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
            - name: mlruns
              mountPath: /mlruns
      volumes:
        - name: mlflow-data
          emptyDir: {}
        - name: mlruns
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlops-energy
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops-energy
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: pushgateway
        honor_labels: true
        static_configs:
          - targets: ['pushgateway:9091']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mlops-energy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mlops-energy
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
