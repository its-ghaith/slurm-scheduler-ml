name: Build research runtime image

on:
  workflow_dispatch:
  push:
    branches:
      - opa-data-sulrm-rancher
    paths:
      - Dockerfile.runtime
      - containers/runtime-requirements.txt
      - .github/workflows/build-runtime-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/mlops-slurm-runtime:research-v2
            ghcr.io/${{ github.repository }}/mlops-slurm-runtime:sha-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Publish immutable digest
        run: echo "ghcr.io/${GITHUB_REPOSITORY}/mlops-slurm-runtime@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
